<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720"><defs><style>.bg{fill:#0b1118}.box{fill:#131e28;stroke:#3a4c59;stroke-width:2}.board{fill:#17302f;stroke:#72e2bf;stroke-width:3}.title{font:700 25px Arial;fill:#e8eef3}.sub{font:15px Arial;fill:#9cadb9}.txt{font:17px Arial;fill:#dbe5eb}.pin{font:700 16px Consolas;fill:#8bb7ff}.green{stroke:#72e2bf}.blue{stroke:#89b7ff}.amber{stroke:#f2c677}.line{fill:none;stroke-width:4}.small{font:13px Arial;fill:#9cadb9}.warn{font:700 15px Arial;fill:#f2c677}</style></defs><rect class="bg" width="1160" height="720"/><text class="title" x="40" y="48">SignalScope · Teensy 4.1 bridge wiring</text><text class="sub" x="40" y="76">Included firmware: UART RX/TX + 4-channel GPIO edge and software capture</text>
<rect class="box" x="45" y="145" width="220" height="130" rx="15"/><text class="title" x="82" y="190">PC / Browser</text><text class="txt" x="72" y="222">Web Serial · USB</text><text class="small" x="70" y="250">Chrome / Edge · localhost</text>
<path class="line green" d="M265 210H390"/><text class="small" x="285" y="195">USB cable</text>
<rect class="board" x="390" y="115" width="360" height="450" rx="24"/><text class="title" x="447" y="160">Teensy 4.1</text><text class="sub" x="457" y="185">USB Serial bridge firmware</text>
<rect class="box" x="425" y="220" width="290" height="105" rx="10"/><text class="pin" x="445" y="253">0 / RX1</text><text class="txt" x="545" y="253">UART target RX</text><text class="pin" x="445" y="294">1 / TX1</text><text class="txt" x="545" y="294">UART target TX</text>
<rect class="box" x="425" y="350" width="290" height="115" rx="10"/><text class="pin" x="445" y="385">2, 3, 4, 5</text><text class="txt" x="565" y="385">GPIO capture inputs</text><text class="pin" x="445" y="430">GND</text><text class="txt" x="565" y="430">shared ground</text>
<text class="warn" x="425" y="515">GPIO maximum: 3.3 V</text>
<rect class="box" x="875" y="130" width="240" height="165" rx="14"/><text class="title" x="911" y="170">Target UART</text><text class="txt" x="898" y="212">TX ─────────► pin 0</text><text class="txt" x="898" y="248">RX ◄───────── pin 1*</text><text class="txt" x="898" y="278">GND ───────── GND</text>
<path class="line green" d="M750 250H875"/><path class="line blue" d="M750 291H875"/><path class="line amber" d="M750 430H840V278H875"/>
<rect class="box" x="875" y="360" width="240" height="160" rx="14"/><text class="title" x="911" y="400">GPIO signals</text><text class="txt" x="900" y="440">D0..D3 ──────► pins 2..5</text><text class="txt" x="900" y="480">GND ───────── GND</text><path class="line green" d="M750 400H875"/><path class="line amber" d="M750 443H830V480H875"/>
<rect class="box" x="50" y="350" width="250" height="170" rx="14"/><text class="title" x="78" y="390">PCB safeguards</text><text class="txt" x="72" y="426">3.3 V level-safe inputs</text><text class="txt" x="72" y="458">ESD / series protection</text><text class="txt" x="72" y="490">Target power kept separate</text><path class="line amber" d="M300 435H390"/>
<text class="small" x="875" y="555">* TX connection optional; keep open for passive-only capture.</text><text class="warn" x="45" y="625">Never connect 5 V signals directly to Teensy pins. CAN needs an external transceiver; I2C/SPI/SWD/JTAG decoders are not in this firmware.</text><text class="small" x="45" y="663">Future PCB taps: I2C SDA 18 / SCL 19 · SPI MOSI 11 / MISO 12 / SCK 13 / CS 10 · CAN1 CTX 22 / CRX 23 → transceiver.</text></svg>